services:
  sella:
    build: .
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar}
      QR_PEPPER: ${QR_PEPPER:-dev-pepper-cambiar}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DB_PATH: /data/sella.db
      AUTO_SEED: "true"
    volumes:
      - sella-data:/data
    restart: unless-stopped

volumes:
  sella-data:
